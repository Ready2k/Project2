<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Export Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #f5f5f5; }
        .result { padding: 10px; margin: 5px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        h1 { color: #333; }
    </style>
</head>
<body>
    <h1>🧪 Global Export Test</h1>
    <div id="results"></div>

    <!-- Load scripts in order -->
    <script src="../debug-manager.js"></script>
    <script src="../persona-manager.js"></script>
    <script src="../system-prompts-manager.js"></script>
    <script src="../token-tracker.js"></script>
    <script src="../api-client.js"></script>
    <script src="../streaming-manager.js"></script>
    <script src="../agents/base-agent.js"></script>
    <script src="../agents/payments-agent.js"></script>
    <script src="../agents/fraud-agent.js"></script>
    <script src="../agents/idv-agent.js"></script>
    <script src="../agents/banking-info-agent.js"></script>
    <script src="../agents/guardrails-manager.js"></script>
    <script src="../agents/voice-config-manager.js"></script>
    <script src="../agents/llm-manager.js"></script>
    <script src="../agents/agent-router.js"></script>
    <script src="../agent-telemetry.js"></script>
    <script src="../llm-manager-admin-ui.js"></script>

    <script>
        function addResult(message, isSuccess) {
            const div = document.createElement('div');
            div.className = `result ${isSuccess ? 'success' : 'error'}`;
            div.textContent = message;
            document.getElementById('results').appendChild(div);
        }

        // Test all required classes
        const requiredClasses = [
            'PersonaManager',
            'SystemPromptsManager', 
            'TokenTracker',
            'OpenAIClient',
            'StreamingManager',
            'BaseAgent',
            'PaymentsAgent',
            'FraudAgent',
            'IDVAgent',
            'BankingInfoAgent',
            'GuardrailsManager',
            'VoiceConfigManager',
            'LLMManager',
            'AgentRouter',
            'LLMManagerAdminUI'
        ];

        let successCount = 0;
        let totalCount = requiredClasses.length;

        requiredClasses.forEach(className => {
            if (typeof window[className] !== 'undefined') {
                addResult(`✅ ${className} - Available`, true);
                successCount++;
            } else {
                addResult(`❌ ${className} - Missing`, false);
            }
        });

        // Summary
        addResult(`\n📊 Summary: ${successCount}/${totalCount} classes available`, successCount === totalCount);

        if (successCount === totalCount) {
            addResult('🎉 All exports working correctly!', true);
        } else {
            addResult(`⚠️ ${totalCount - successCount} classes still missing`, false);
        }

        // Test instantiation
        addResult('\n🔧 Testing instantiation...', true);
        try {
            if (window.PersonaManager) {
                const pm = new PersonaManager();
                addResult('✅ PersonaManager can be instantiated', true);
            }
            if (window.TokenTracker) {
                const tt = new TokenTracker();
                addResult('✅ TokenTracker can be instantiated', true);
            }
            if (window.OpenAIClient) {
                const oc = new OpenAIClient('test-key');
                addResult('✅ OpenAIClient can be instantiated', true);
            }
        } catch (error) {
            addResult(`❌ Instantiation error: ${error.message}`, false);
        }
    </script>
</body>
</html>
