<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Indicator Integration Test</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { padding: 20px; font-family: Arial, sans-serif; }
        .test-container { max-width: 800px; margin: 0 auto; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 8px; }
        .test-button { margin: 5px; padding: 8px 16px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .test-input { width: 300px; padding: 8px; margin: 5px; border: 1px solid #ddd; border-radius: 4px; }
        .log-output { background: #f8f9fa; padding: 10px; border-radius: 4px; font-family: monospace; font-size: 12px; max-height: 200px; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🔧 Agent Indicator Integration Test</h1>
        
        <div class="test-section">
            <h3>Current Agent Indicator</h3>
            <div class="agent-indicator">
                <span class="agent-label">Current Agent:</span>
                <span id="currentAgent" class="agent-name default-agent">Default Agent</span>
            </div>
        </div>

        <div class="test-section">
            <h3>Test Agent Routing with Indicator</h3>
            <input type="text" id="testInput" class="test-input" placeholder="Enter test message..." value="I've lost my card">
            <button class="test-button" onclick="testAgentRouting()">Test Routing</button>
            <button class="test-button" onclick="testFraudScenario()">Test Fraud Scenario</button>
            <button class="test-button" onclick="testPaymentScenario()">Test Payment Scenario</button>
            <button class="test-button" onclick="testDefaultScenario()">Test Default Scenario</button>
        </div>

        <div class="test-section">
            <h3>Test Results</h3>
            <div id="testLog" class="log-output"></div>
        </div>
    </div>

    <!-- Load dependencies -->
    <script src="debug-manager.js"></script>
    <script src="agents/security-manager.js"></script>
    <script src="agents/base-agent.js"></script>
    <script src="agents/agent-config-manager.js"></script>
    <script src="agents/fraud-agent.js"></script>
    <script src="agents/payments-agent.js"></script>
    <script src="agents/idv-agent.js"></script>
    <script src="agents/banking-info-agent.js"></script>
    <script src="agents/agent-router.js"></script>

    <script>
        // Enable debug mode
        window.debugManager.enable();
        
        let agentRouter = null;
        let testLog = [];

        // Initialize agent system
        function initializeAgentSystem() {
            try {
                // Create agents
                const agents = [
                    new FraudAgent(),
                    new PaymentsAgent(),
                    new IDVAgent(),
                    new BankingInfoAgent()
                ];

                // Initialize router
                agentRouter = new AgentRouter([]);
                
                // Register agents
                agents.forEach(agent => {
                    agentRouter.registerAgent(agent);
                });

                log('✅ Agent system initialized successfully');
                
            } catch (error) {
                log(`❌ Failed to initialize agent system: ${error.message}`);
            }
        }

        // Mock the agent indicator functions
        function updateAgentIndicator(agentName) {
            const agentElement = document.getElementById('currentAgent');
            if (!agentElement) return;

            agentElement.textContent = agentName;
            
            // Remove existing classes
            agentElement.classList.remove('fraud-agent', 'payments-agent', 'idv-agent', 'banking-info-agent', 'default-agent');
            
            // Add appropriate class
            const agentClass = getAgentClass(agentName);
            if (agentClass) {
                agentElement.classList.add(agentClass);
            }
            
            log(`🤖 Agent indicator updated: ${agentName}`);
        }

        function getAgentClass(agentName) {
            const agentClassMap = {
                'FraudAgent': 'fraud-agent',
                'PaymentsAgent': 'payments-agent',
                'IDVAgent': 'idv-agent',
                'BankingInfoAgent': 'banking-info-agent',
                'Default Agent': 'default-agent'
            };
            
            return agentClassMap[agentName] || 'default-agent';
        }

        // Test functions
        async function testAgentRouting() {
            const input = document.getElementById('testInput').value;
            if (!input.trim()) {
                log('❌ Please enter a test message');
                return;
            }

            if (!agentRouter) {
                log('❌ Agent router not initialized');
                return;
            }

            try {
                log(`🧪 Testing input: "${input}"`);
                
                // Test synchronous routing first
                const syncAgent = agentRouter.findBestAgentSync(input);
                if (syncAgent) {
                    log(`📍 Sync routing selected: ${syncAgent.name}`);
                    updateAgentIndicator(syncAgent.name);
                } else {
                    log(`📍 Sync routing: No agent found, using Default Agent`);
                    updateAgentIndicator('Default Agent');
                }

                // Test full routing with context
                const context = {
                    conversationHistory: [],
                    lastAgentUsed: null
                };
                
                const result = await agentRouter.route(input, context);
                log(`📋 Full routing result: ${result.agentName || 'Default Agent'}`);
                log(`💬 Response: ${result.response.substring(0, 100)}...`);
                
                if (result.agentName) {
                    updateAgentIndicator(result.agentName);
                }

            } catch (error) {
                log(`❌ Error testing routing: ${error.message}`);
            }
        }

        function testFraudScenario() {
            document.getElementById('testInput').value = "I think my card has been stolen";
            testAgentRouting();
        }

        function testPaymentScenario() {
            document.getElementById('testInput').value = "Send £50 to Alice";
            testAgentRouting();
        }

        function testDefaultScenario() {
            document.getElementById('testInput').value = "What's the weather like today?";
            testAgentRouting();
        }

        function log(message) {
            testLog.push(`[${new Date().toLocaleTimeString()}] ${message}`);
            const logElement = document.getElementById('testLog');
            logElement.textContent = testLog.join('\n');
            logElement.scrollTop = logElement.scrollHeight;
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            log('🚀 Initializing Agent Indicator Integration Test...');
            initializeAgentSystem();
            updateAgentIndicator('Default Agent');
        });
    </script>
</body>
</html>
