<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dependencies Test</title>
</head>
<body>
    <h1>Dependencies Test</h1>
    <div id="results"></div>

    <!-- Include all required dependencies in the same order as index.html -->
    <script src="debug-manager.js"></script>
    <script src="agent-telemetry.js"></script>
    <script src="token-tracker.js"></script>
    <script src="api-client.js"></script>
    <script src="streaming-manager.js"></script>
    <script src="persona-manager.js"></script>
    <script src="system-prompts-manager.js"></script>
    
    <!-- Agent modules -->
    <script src="agents/security-manager.js"></script>
    <script src="agents/base-agent.js"></script>
    <script src="agents/agent-config-manager.js"></script>
    <script src="agents/idv-agent.js"></script>
    <script src="agents/banking-info-agent.js"></script>
    <script src="agents/fraud-agent.js"></script>
    <script src="agents/payments-agent.js"></script>
    <script src="agents/agent-router.js"></script>
    <script src="agents/telemetry-hooks.js"></script>

    <script>
        function testDependencies() {
            const results = document.getElementById('results');
            const tests = [
                { name: 'SecurityManager', class: SecurityManager },
                { name: 'BaseAgent', class: BaseAgent },
                { name: 'AgentConfigManager', class: AgentConfigManager },
                { name: 'IDVAgent', class: IDVAgent },
                { name: 'BankingInfoAgent', class: BankingInfoAgent },
                { name: 'FraudAgent', class: FraudAgent },
                { name: 'PaymentsAgent', class: PaymentsAgent },
                { name: 'AgentRouter', class: AgentRouter },
                { name: 'TokenTracker', class: TokenTracker },
                { name: 'PersonaManager', class: PersonaManager },
                { name: 'SystemPromptsManager', class: SystemPromptsManager },
                { name: 'TelemetryHooksManager', class: TelemetryHooksManager }
            ];

            let html = '<h2>Dependency Check Results:</h2><ul>';
            let allPassed = true;

            tests.forEach(test => {
                try {
                    if (typeof test.class === 'function') {
                        html += `<li style="color: green;">✅ ${test.name} - Available</li>`;
                    } else {
                        html += `<li style="color: red;">❌ ${test.name} - Not a constructor</li>`;
                        allPassed = false;
                    }
                } catch (error) {
                    html += `<li style="color: red;">❌ ${test.name} - ${error.message}</li>`;
                    allPassed = false;
                }
            });

            html += '</ul>';

            // Test AgentRouter initialization
            try {
                const agents = [
                    new PaymentsAgent(),
                    new FraudAgent(),
                    new IDVAgent(),
                    new BankingInfoAgent()
                ];
                const router = new AgentRouter(agents);
                html += '<h3 style="color: green;">✅ AgentRouter initialization successful</h3>';
                
                const stats = router.getStats();
                html += `<p>Registered agents: ${stats.totalAgents}</p>`;
                html += `<p>Enabled agents: ${stats.enabledAgents}</p>`;
                html += `<p>Agent names: ${stats.agentNames.join(', ')}</p>`;

                // Test global availability
                window.testAgentRouter = router;
                html += '<p>✅ AgentRouter available globally</p>';
                
            } catch (error) {
                html += `<h3 style="color: red;">❌ AgentRouter initialization failed: ${error.message}</h3>`;
                allPassed = false;
            }

            // Test extensibility system components
            try {
                if (typeof initializeExtensibilitySystem === 'function') {
                    html += '<h3 style="color: green;">✅ Extensibility system available</h3>';
                } else {
                    html += '<h3 style="color: orange;">⚠️ Extensibility system not available</h3>';
                }
            } catch (error) {
                html += `<h3 style="color: red;">❌ Extensibility system check failed: ${error.message}</h3>`;
            }

            // Test telemetry hooks manager initialization
            try {
                const telemetryManager = new TelemetryHooksManager();
                if (typeof telemetryManager.isEnabled === 'function') {
                    html += '<p>✅ TelemetryHooksManager.isEnabled() method available</p>';
                    html += `<p>Telemetry enabled: ${telemetryManager.isEnabled()}</p>`;
                } else {
                    html += '<p style="color: red;">❌ TelemetryHooksManager.isEnabled() method missing</p>';
                    allPassed = false;
                }
            } catch (error) {
                html += `<p style="color: red;">❌ TelemetryHooksManager test failed: ${error.message}</p>`;
                allPassed = false;
            }

            if (allPassed) {
                html += '<h2 style="color: green;">🎉 All dependencies loaded successfully!</h2>';
            } else {
                html += '<h2 style="color: red;">⚠️ Some dependencies failed to load</h2>';
            }

            results.innerHTML = html;
        }

        // Run test when page loads
        window.addEventListener('load', testDependencies);
    </script>
</body>
</html>
