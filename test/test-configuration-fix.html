<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Configuration Fix</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        .warning { background: #fff3cd; color: #856404; }
        button { margin: 5px; padding: 8px 16px; }
        #test-config-content { border: 1px solid #ccc; min-height: 200px; padding: 10px; margin: 10px 0; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
        .modal.active { display: flex; align-items: center; justify-content: center; }
        .modal-content { background: white; border-radius: 10px; width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto; }
        .modal-header { background: #34495e; color: white; padding: 20px; border-radius: 10px 10px 0 0; }
        .modal-body { padding: 20px; }
        .tab-nav { display: flex; border-bottom: 2px solid #ecf0f1; margin-bottom: 20px; }
        .tab-btn { padding: 12px 20px; background: none; border: none; cursor: pointer; }
        .tab-btn.active { color: #3498db; border-bottom: 3px solid #3498db; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .form-group { margin-bottom: 15px; }
        .form-label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-input, .form-select, .form-textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Configuration Fix Test</h1>
    
    <div class="test-section">
        <h2>Configuration Functions Test</h2>
        <button onclick="testConfigFunctions()">Test Config Functions</button>
        <div id="config-function-results"></div>
    </div>
    
    <div class="test-section">
        <h2>Configuration Section Test</h2>
        <button onclick="testConfigSection()">Test Config Section</button>
        <div id="test-config-content">
            <!-- Test configuration content will be loaded here -->
        </div>
        <div id="config-section-results"></div>
    </div>
    
    <div class="test-section">
        <h2>Modal Test</h2>
        <button onclick="testModal()">Test Modal</button>
        <div id="modal-results"></div>
    </div>

    <!-- Mock Modal -->
    <div id="configModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Test Modal</h2>
                <button onclick="closeModal('configModal')" style="background: none; border: none; color: white; font-size: 20px; cursor: pointer;">&times;</button>
            </div>
            <div class="modal-body">
                <div class="tab-nav">
                    <button class="tab-btn active" data-tab="basic">Basic Settings</button>
                    <button class="tab-btn" data-tab="llm">LLM Configuration</button>
                    <button class="tab-btn" data-tab="triggers">Triggers</button>
                    <button class="tab-btn" data-tab="advanced">Advanced</button>
                </div>
                <div id="basic-tab" class="tab-content active">Basic tab content will be loaded here</div>
                <div id="llm-tab" class="tab-content">LLM tab content will be loaded here</div>
                <div id="triggers-tab" class="tab-content">Triggers tab content will be loaded here</div>
                <div id="advanced-tab" class="tab-content">Advanced tab content will be loaded here</div>
            </div>
        </div>
    </div>

    <!-- Load dependencies -->
    <script src="debug-manager.js"></script>
    <script src="system-prompts-manager.js"></script>
    <script src="agents/llm-manager.js"></script>
    <script src="agents/guardrails-manager.js"></script>
    <script src="agents/voice-config-manager.js"></script>
    <script src="agents/agent-config-manager.js"></script>
    <script src="llm-manager-admin-ui.js"></script>
    
    <script>
        function addResult(containerId, message, type = 'info') {
            const container = document.getElementById(containerId);
            const div = document.createElement('div');
            div.className = `test-section ${type}`;
            div.innerHTML = message;
            container.appendChild(div);
        }
        
        function testConfigFunctions() {
            const container = document.getElementById('config-function-results');
            container.innerHTML = '';
            
            const functions = [
                'loadConfigurationSection',
                'loadAgentConfiguration',
                'openAgentConfigModal',
                'loadConfigurationForm',
                'saveAgentConfiguration',
                'closeModal'
            ];
            
            functions.forEach(funcName => {
                if (typeof window[funcName] === 'function') {
                    addResult('config-function-results', `✅ ${funcName} is available`, 'success');
                } else {
                    addResult('config-function-results', `❌ ${funcName} is missing`, 'error');
                }
            });
            
            // Test admin UI
            if (window.adminUI) {
                addResult('config-function-results', '✅ Admin UI is available', 'success');
                if (window.adminUI.llmManager) {
                    addResult('config-function-results', '✅ LLM Manager is available', 'success');
                } else {
                    addResult('config-function-results', '⚠️ LLM Manager not available', 'warning');
                }
            } else {
                addResult('config-function-results', '⚠️ Admin UI not available', 'warning');
            }
        }
        
        function testConfigSection() {
            const container = document.getElementById('config-section-results');
            container.innerHTML = '';
            
            try {
                // Create mock configurationContent element
                const testContent = document.getElementById('test-config-content');
                testContent.id = 'configurationContent';
                
                // Test loadConfigurationSection
                if (typeof loadConfigurationSection === 'function') {
                    loadConfigurationSection();
                    addResult('config-section-results', '✅ loadConfigurationSection called successfully', 'success');
                    
                    // Check if content was added
                    if (testContent.innerHTML.trim().length > 0) {
                        addResult('config-section-results', '✅ Configuration content was loaded', 'success');
                    } else {
                        addResult('config-section-results', '⚠️ Configuration content appears empty', 'warning');
                    }
                } else {
                    addResult('config-section-results', '❌ loadConfigurationSection not available', 'error');
                }
                
                // Restore original ID
                testContent.id = 'test-config-content';
                
            } catch (error) {
                addResult('config-section-results', `❌ Error: ${error.message}`, 'error');
            }
        }
        
        function testModal() {
            const container = document.getElementById('modal-results');
            container.innerHTML = '';
            
            try {
                // Test loadConfigurationForm
                if (typeof loadConfigurationForm === 'function') {
                    loadConfigurationForm('DefaultAgent');
                    addResult('modal-results', '✅ loadConfigurationForm called successfully', 'success');
                    
                    // Check if tabs were populated
                    const basicTab = document.getElementById('basic-tab');
                    const llmTab = document.getElementById('llm-tab');
                    
                    if (basicTab && basicTab.innerHTML.includes('Agent Name')) {
                        addResult('modal-results', '✅ Basic tab was populated', 'success');
                    } else {
                        addResult('modal-results', '⚠️ Basic tab not populated properly', 'warning');
                    }
                    
                    if (llmTab && llmTab.innerHTML.includes('LLM Provider')) {
                        addResult('modal-results', '✅ LLM tab was populated', 'success');
                    } else {
                        addResult('modal-results', '⚠️ LLM tab not populated properly', 'warning');
                    }
                    
                    // Show the modal for visual inspection
                    document.getElementById('configModal').classList.add('active');
                    addResult('modal-results', '✅ Modal opened for inspection', 'info');
                    
                } else {
                    addResult('modal-results', '❌ loadConfigurationForm not available', 'error');
                }
                
            } catch (error) {
                addResult('modal-results', `❌ Error: ${error.message}`, 'error');
            }
        }
        
        // Auto-run tests when page loads
        window.addEventListener('load', () => {
            setTimeout(() => {
                testConfigFunctions();
            }, 1000);
        });
    </script>
</body>
</html>
