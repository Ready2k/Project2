<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Context Manager Fix Test - Simple</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-case { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .test-case h3 { margin-top: 0; color: #333; }
        .result { margin: 10px 0; padding: 10px; border-radius: 3px; }
        .success { background-color: #d4edda; color: #155724; }
        .failure { background-color: #f8d7da; color: #721c24; }
        .info { background-color: #d1ecf1; color: #0c5460; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        .log { background-color: #f8f9fa; padding: 10px; margin: 10px 0; border-radius: 3px; font-family: monospace; font-size: 12px; max-height: 200px; overflow-y: auto; }
    </style>
</head>
<body>
    <h1>Context Manager Fix Test - Simple</h1>
    <p>This test verifies that the ConversationContextManager correctly handles intent changes.</p>
    
    <button onclick="runTests()">Run Tests</button>
    <button onclick="clearLogs()">Clear Logs</button>
    
    <div id="results"></div>
    <div id="logs" class="log"></div>

    <script>
        // Mock debug manager
        window.debugManager = {
            createModuleLogger: (name) => ({
                info: (...args) => log(`[INFO] ${name}: ${JSON.stringify(args)}`),
                debug: (...args) => log(`[DEBUG] ${name}: ${JSON.stringify(args)}`),
                warn: (...args) => log(`[WARN] ${name}: ${JSON.stringify(args)}`),
                error: (...args) => log(`[ERROR] ${name}: ${JSON.stringify(args)}`)
            })
        };

        function log(message) {
            const logsDiv = document.getElementById('logs');
            logsDiv.innerHTML += message + '\n';
            logsDiv.scrollTop = logsDiv.scrollHeight;
            console.log(message);
        }

        function clearLogs() {
            document.getElementById('logs').innerHTML = '';
        }

        // Simplified ConversationContextManager for testing
        class TestConversationContextManager {
            constructor() {
                this.conversationHistory = [];
                this.contextData = new Map();
                this.debug = window.debugManager.createModuleLogger('ConversationContextManager');
            }

            addMessage(role, content, agentName = null) {
                const message = {
                    role,
                    content,
                    agent: agentName,
                    timestamp: Date.now()
                };
                this.conversationHistory.push(message);
                
                if (role === 'assistant' && agentName) {
                    this.updateContextData('lastAgentUsed', agentName);
                    this.updateContextData('lastAgentTimestamp', Date.now());
                }
            }

            updateContextData(key, value) {
                this.contextData.set(key, { value, timestamp: Date.now() });
            }

            getContextData(key) {
                const entry = this.contextData.get(key);
                return entry ? entry.value : null;
            }

            containsNewIntent(inputText) {
                const lowerInput = inputText.toLowerCase();
                const newIntentPatterns = [
                    /fraud/, /fraudulent/, /unauthorized/, /not.*me/, /didn't.*make/, /suspicious/, /block/, /freeze/, /stolen/, /compromised/,
                    /transfer/, /send.*money/, /payment/, /pay.*bill/, /wire/, /standing.*order/, /direct.*debit/,
                    /balance/, /statement/, /transaction.*history/, /account.*details/, /sort.*code/, /account.*number/,
                    /verify.*identity/, /prove.*who/, /security.*question/, /authentication/, /two.*factor/,
                    /i.*want/, /i.*need/, /can.*you/, /help.*me.*with/, /i.*have.*problem/
                ];
                return newIntentPatterns.some(pattern => pattern.test(lowerInput));
            }

            isFollowUpInput(inputText) {
                const normalizedInput = inputText.toLowerCase().trim();
                const followUpPatterns = [
                    /^(yes|yeah|yep|ok|okay|sure|do it|go ahead|proceed)$/,
                    /^(no|nope|don't|stop|cancel|abort)$/,
                    /^(what about|how about|also|and|but|however).*$/,
                    /^(that|this|it|they|them).*$/,
                    /^(more|another|again|continue|next).*$/
                ];
                return followUpPatterns.some(pattern => pattern.test(normalizedInput)) || normalizedInput.length <= 5;
            }

            getSuggestedAgent(inputText, availableAgents) {
                const lastAgentUsed = this.getContextData('lastAgentUsed');
                const lastAgentTimestamp = this.getContextData('lastAgentTimestamp');
                
                console.log('DEBUG: getSuggestedAgent called', {
                    inputText: inputText.substring(0, 50),
                    lastAgentUsed,
                    timeSinceLastAgent: lastAgentTimestamp ? Math.round((Date.now() - lastAgentTimestamp) / 1000) : null
                });
                
                const isVeryRecentAgent = lastAgentTimestamp && 
                    (Date.now() - lastAgentTimestamp) < (2 * 60 * 1000);
                
                const lowerInput = inputText.toLowerCase();
                
                // CRITICAL: Check for clear intent changes
                const intentChangePatterns = [
                    { patterns: [/fraud/, /fraudulent/, /unauthorized/, /not.*me/, /didn't.*make/, /suspicious.*transaction/, /block.*card/, /freeze.*card/, /stolen/, /compromised/], targetAgent: 'FraudAgent' },
                    { patterns: [/transfer/, /send.*money/, /payment/, /pay.*bill/, /wire/, /standing.*order/, /direct.*debit/], targetAgent: 'PaymentsAgent' },
                    { patterns: [/verify.*identity/, /prove.*who/, /security.*question/, /authentication/, /two.*factor/, /verify.*account/], targetAgent: 'IDVAgent' },
                    { patterns: [/balance/, /statement/, /transaction.*history/, /account.*details/, /sort.*code/, /account.*number/], targetAgent: 'BankingInfoAgent' }
                ];
                
                // Check if this is a clear intent change
                for (const intentGroup of intentChangePatterns) {
                    const hasIntent = intentGroup.patterns.some(pattern => pattern.test(lowerInput));
                    if (hasIntent) {
                        if (lastAgentUsed && intentGroup.targetAgent !== lastAgentUsed) {
                            this.debug.info('Intent change detected - bypassing context routing', {
                                inputText: inputText.substring(0, 50),
                                detectedIntent: intentGroup.targetAgent,
                                lastAgent: lastAgentUsed,
                                reason: 'clear intent change detected'
                            });
                            return null; // Let AI routing handle this
                        }
                        
                        const targetAgent = availableAgents.find(a => a.name === intentGroup.targetAgent);
                        if (targetAgent && targetAgent.enabled !== false) {
                            this.debug.info('Intent matches current context', {
                                agentName: targetAgent.name,
                                inputText: inputText.substring(0, 50),
                                reason: 'intent matches context'
                            });
                            return targetAgent;
                        }
                    }
                }
                
                // Special handling for fraud follow-ups
                const fraudFollowUpPatterns = [
                    /yes.*block/, /yeah.*block/, /yes.*freeze/, /yeah.*freeze/,
                    /yes.*stop/, /yeah.*stop/, /yes.*cancel/, /yeah.*cancel/,
                    /block.*card/, /freeze.*card/, /stop.*card/,
                    /yes.*that.*card/, /block.*that/, /freeze.*that/
                ];
                
                const isFraudFollowUp = fraudFollowUpPatterns.some(pattern => pattern.test(lowerInput));
                
                if (isFraudFollowUp) {
                    const fraudAgent = availableAgents.find(a => a.name === 'FraudAgent');
                    if (fraudAgent && fraudAgent.enabled !== false) {
                        this.debug.info('Suggested FraudAgent for fraud follow-up', {
                            inputText: inputText.substring(0, 50),
                            reason: 'fraud-related follow-up detected'
                        });
                        return fraudAgent;
                    }
                }
                
                // Follow-up handling
                if (isVeryRecentAgent && lastAgentUsed) {
                    const lastAgent = availableAgents.find(a => a.name === lastAgentUsed);
                    if (lastAgent && lastAgent.enabled !== false) {
                        const lastMessage = this.conversationHistory.length > 0 ? 
                            this.conversationHistory[this.conversationHistory.length - 1] : null;
                        
                        if (lastMessage && lastMessage.role === 'assistant') {
                            const askingForInfo = ['provide', 'please', 'confirm', 'verify', 'enter', 'give me'].some(word =>
                                lastMessage.content.toLowerCase().includes(word)
                            );
                            
                            if (askingForInfo && this.isFollowUpInput(inputText)) {
                                this.debug.info('Suggested agent based on recent information request', {
                                    agentName: lastAgent.name,
                                    inputText: inputText.substring(0, 50),
                                    reason: 'responding to recent information request'
                                });
                                return lastAgent;
                            }
                        }
                    }
                }
                
                if (this.isFollowUpInput(inputText) && lastAgentUsed && !this.containsNewIntent(inputText)) {
                    const lastAgent = availableAgents.find(a => a.name === lastAgentUsed);
                    if (lastAgent && lastAgent.enabled !== false) {
                        this.debug.info('Suggested agent based on follow-up context', {
                            agentName: lastAgent.name,
                            inputText: inputText.substring(0, 50),
                            reason: 'follow-up to previous conversation'
                        });
                        return lastAgent;
                    }
                }

                return null;
            }

            clearContext() {
                this.conversationHistory = [];
                this.contextData.clear();
            }
        }

        function runTests() {
            clearLogs();
            log('🧪 Starting Context Manager Fix Tests...');
            
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '';

            const contextManager = new TestConversationContextManager();
            const agents = [
                { name: 'BankingInfoAgent', enabled: true },
                { name: 'FraudAgent', enabled: true },
                { name: 'PaymentsAgent', enabled: true },
                { name: 'IDVAgent', enabled: true }
            ];

            const testCases = [
                {
                    name: 'Banking to Fraud Intent Change',
                    setup: () => {
                        contextManager.addMessage('user', "What's my balance?");
                        contextManager.addMessage('assistant', 'Your balance is £2,450.75', 'BankingInfoAgent');
                    },
                    input: "I have fraud in my account. The coffee shop transaction was not me.",
                    expectedResult: null, // Should return null to allow AI routing
                    description: 'Should detect intent change and return null for AI routing'
                },
                {
                    name: 'Banking to Payments Intent Change',
                    setup: () => {
                        contextManager.clearContext();
                        contextManager.addMessage('user', "Show me my account balance");
                        contextManager.addMessage('assistant', 'Your balance is £2,450.75', 'BankingInfoAgent');
                    },
                    input: "I want to transfer money to my friend",
                    expectedResult: null, // Should return null to allow AI routing
                    description: 'Should detect payment intent change and return null for AI routing'
                },
                {
                    name: 'Fraud Follow-up',
                    setup: () => {
                        contextManager.clearContext();
                        contextManager.addMessage('user', "I have fraud in my account");
                        contextManager.addMessage('assistant', 'I can help with that fraud report', 'FraudAgent');
                    },
                    input: "Yes, block that card",
                    expectedResult: 'FraudAgent', // Should suggest FraudAgent for fraud follow-up
                    description: 'Should suggest FraudAgent for fraud-related follow-up'
                },
                {
                    name: 'Same Intent Continuation',
                    setup: () => {
                        contextManager.clearContext();
                        contextManager.addMessage('user', "What's my balance?");
                        contextManager.addMessage('assistant', 'Your balance is £2,450.75', 'BankingInfoAgent');
                    },
                    input: "What about my savings account balance?",
                    expectedResult: 'BankingInfoAgent', // Should suggest same agent for same intent
                    description: 'Should suggest same agent when intent matches'
                }
            ];

            let allTestsPassed = true;

            testCases.forEach((testCase, index) => {
                const testDiv = document.createElement('div');
                testDiv.className = 'test-case';
                testDiv.innerHTML = `<h3>Test ${index + 1}: ${testCase.name}</h3><p>${testCase.description}</p>`;

                try {
                    testCase.setup();
                    const result = contextManager.getSuggestedAgent(testCase.input, agents);
                    const resultName = result ? result.name : null;
                    
                    const passed = resultName === testCase.expectedResult;
                    
                    const resultDiv = document.createElement('div');
                    resultDiv.className = `result ${passed ? 'success' : 'failure'}`;
                    resultDiv.innerHTML = `
                        <strong>Input:</strong> "${testCase.input}"<br>
                        <strong>Expected:</strong> ${testCase.expectedResult || 'null (AI routing)'}<br>
                        <strong>Got:</strong> ${resultName || 'null'}<br>
                        <strong>Result:</strong> ${passed ? '✅ PASS' : '❌ FAIL'}
                    `;
                    testDiv.appendChild(resultDiv);

                    if (!passed) {
                        allTestsPassed = false;
                    }

                    log(`Test ${index + 1}: ${testCase.name} - ${passed ? 'PASS' : 'FAIL'}`);
                    log(`  Input: "${testCase.input}"`);
                    log(`  Expected: ${testCase.expectedResult || 'null'}, Got: ${resultName || 'null'}`);

                } catch (error) {
                    const errorDiv = document.createElement('div');
                    errorDiv.className = 'result failure';
                    errorDiv.innerHTML = `<strong>ERROR:</strong> ${error.message}`;
                    testDiv.appendChild(errorDiv);
                    allTestsPassed = false;
                    log(`Test ${index + 1}: ${testCase.name} - ERROR: ${error.message}`);
                }

                resultsDiv.appendChild(testDiv);
            });

            // Overall result
            const overallDiv = document.createElement('div');
            overallDiv.className = 'test-case';
            overallDiv.innerHTML = `
                <h3>Overall Result</h3>
                <div class="result ${allTestsPassed ? 'success' : 'failure'}">
                    <strong>${allTestsPassed ? '✅ ALL TESTS PASSED' : '❌ SOME TESTS FAILED'}</strong>
                </div>
            `;
            resultsDiv.appendChild(overallDiv);

            log(`🏁 Tests completed. Overall result: ${allTestsPassed ? 'PASS' : 'FAIL'}`);
        }
    </script>
</body>
</html>
