<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Actions Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ccc;
        }

        .action-btn {
            padding: 10px 20px;
            margin: 5px;
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        .action-btn:hover {
            background: #0056b3;
        }

        #conversation {
            border: 1px solid #ddd;
            padding: 10px;
            min-height: 200px;
            margin: 10px 0;
        }

        .user-message {
            background: #e3f2fd;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
        }

        .bot-message {
            background: #f5f5f5;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <h1>Quick Actions Test</h1>

    <div class="test-section">
        <h2>Test Quick Actions</h2>
        <button class="action-btn" onclick="suggestPhrase('Hello, how are you today?')">
            Test Greeting
        </button>
        <button class="action-btn" onclick="suggestPhrase('What\'s my account balance?')">
            Test Balance
        </button>
        <button class="action-btn" onclick="suggestPhrase('I need help with a transaction')">
            Test Transaction
        </button>
        <button class="action-btn" onclick="suggestPhrase('I think there\'s fraud on my account')">
            Test Fraud Alert
        </button>
    </div>

    <div class="test-section">
        <h2>Conversation Display</h2>
        <div id="conversation"></div>
    </div>

    <div class="test-section">
        <h2>Debug Info</h2>
        <div id="debugInfo">
            <p>speechApp available: <span id="speechAppStatus">Checking...</span></p>
            <p>agentIconManager available: <span id="agentIconStatus">Checking...</span></p>
            <p>suggestPhrase function: <span id="suggestPhraseStatus">Checking...</span></p>
        </div>
    </div>

    <!-- Load required scripts -->
    <script src="debug-manager.js"></script>
    <script src="system-logger.js"></script>
    <script src="agent-icon-manager.js"></script>
    <script src="api-client.js"></script>
    <script src="script.js"></script>
    <script src="main-interface.js"></script>

    <script>
        // Wait for everything to load
        window.addEventListener('load', function () {
            // Check what's available
            document.getElementById('speechAppStatus').textContent = window.speechApp ? 'Available' : 'Not Available';
            document.getElementById('agentIconStatus').textContent = window.agentIconManager ? 'Available' : 'Not Available';
            document.getElementById('suggestPhraseStatus').textContent = typeof suggestPhrase === 'function' ? 'Available' : 'Not Available';

            // Add some debug logging
            console.log('speechApp:', window.speechApp);
            console.log('agentIconManager:', window.agentIconManager);
            console.log('suggestPhrase:', typeof suggestPhrase);
        });

        // Override console.error to show errors on page
        const originalError = console.error;
        console.error = function (...args) {
            originalError.apply(console, args);
            const debugInfo = document.getElementById('debugInfo');
            const errorDiv = document.createElement('div');
            errorDiv.style.color = 'red';
            errorDiv.textContent = 'Error: ' + args.join(' ');
            debugInfo.appendChild(errorDiv);
        };
    </script>
</body>

</html>
