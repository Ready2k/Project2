<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Router Fix Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #f5f5f5; }
        .result { padding: 10px; margin: 5px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        h1 { color: #333; }
    </style>
</head>
<body>
    <h1>🔧 Agent Router Fix Test</h1>
    <div id="results"></div>

    <!-- Load scripts in correct order -->
    <script src="../debug-manager.js"></script>
    <script src="../persona-manager.js"></script>
    <script src="../system-prompts-manager.js"></script>
    <script src="../token-tracker.js"></script>
    <script src="../api-client.js"></script>
    <script src="../streaming-manager.js"></script>
    <script src="../agents/base-agent.js"></script>
    <script src="../agents/payments-agent.js"></script>
    <script src="../agents/fraud-agent.js"></script>
    <script src="../agents/idv-agent.js"></script>
    <script src="../agents/banking-info-agent.js"></script>
    <script src="../agents/guardrails-manager.js"></script>
    <script src="../agents/voice-config-manager.js"></script>
    <script src="../agents/llm-manager.js"></script>
    <script src="../agents/agent-config-manager.js"></script>
    <script src="../agents/agent-router.js"></script>
    <script src="../agent-telemetry.js"></script>
    <script src="../llm-manager-admin-ui.js"></script>
    <script src="../dependency-check.js"></script>

    <script>
        function addResult(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.textContent = message;
            document.getElementById('results').appendChild(div);
        }

        // Test agent classes availability
        addResult('🔍 Testing Agent Classes Availability...', 'info');
        
        const agentClasses = [
            'BaseAgent',
            'PaymentsAgent', 
            'FraudAgent',
            'IDVAgent',
            'BankingInfoAgent',
            'AgentConfigManager',
            'AgentRouter'
        ];

        let availableCount = 0;
        agentClasses.forEach(className => {
            if (typeof window[className] !== 'undefined') {
                addResult(`✅ ${className} - Available`, 'success');
                availableCount++;
            } else {
                addResult(`❌ ${className} - Missing`, 'error');
            }
        });

        addResult(`📊 Agent Classes: ${availableCount}/${agentClasses.length} available`, 
                  availableCount === agentClasses.length ? 'success' : 'error');

        // Test AgentRouter initialization
        addResult('\n🚀 Testing AgentRouter Initialization...', 'info');
        
        try {
            if (typeof AgentRouter !== 'undefined' && typeof AgentConfigManager !== 'undefined') {
                const router = new AgentRouter([]);
                addResult('✅ AgentRouter can be instantiated', 'success');
                
                // Test agent registration
                if (typeof PaymentsAgent !== 'undefined') {
                    const paymentsAgent = new PaymentsAgent();
                    router.registerAgent(paymentsAgent);
                    addResult('✅ PaymentsAgent can be registered', 'success');
                }
                
                const stats = router.getStats();
                addResult(`📈 Router Stats: ${stats.totalAgents} total, ${stats.enabledAgents} enabled`, 'info');
                
            } else {
                addResult('❌ Required classes not available for AgentRouter', 'error');
            }
        } catch (error) {
            addResult(`❌ AgentRouter initialization failed: ${error.message}`, 'error');
        }

        // Test MainInterfaceController
        addResult('\n🎛️ Testing MainInterfaceController...', 'info');
        
        if (typeof MainInterfaceController !== 'undefined') {
            addResult('✅ MainInterfaceController class available', 'success');
        } else {
            addResult('❌ MainInterfaceController not available', 'error');
        }

        // Test dependency check results
        addResult('\n📋 Dependency Check Results...', 'info');
        
        setTimeout(() => {
            if (window.dependencyCheck) {
                const { available, missing, allAvailable } = window.dependencyCheck;
                addResult(`✅ Available: ${available.length}`, 'success');
                addResult(`❌ Missing: ${missing.length}`, missing.length === 0 ? 'success' : 'error');
                
                if (allAvailable) {
                    addResult('🎉 All dependencies resolved!', 'success');
                } else {
                    addResult('⚠️ Some dependencies still missing:', 'error');
                    missing.forEach(dep => addResult(`   - ${dep}`, 'error'));
                }
            } else {
                addResult('❌ Dependency check not available', 'error');
            }
        }, 500);
    </script>
</body>
</html>
