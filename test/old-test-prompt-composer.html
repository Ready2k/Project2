
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prompt Composer Test</title>
  <script type="module">
    import { buildPromptMessages } from '../agents/prompt-composer.js';

    const systemPrompt = "Always be professional.";
    const agentPrompt = "Speak like a pirate!";
    const mockGuardrails = {
      checkPromptOverride(global, agent) {
        return agent.includes("pirate") ? "Pirate talk not allowed." : null;
      }
    };

    try {
      const messages = buildPromptMessages({
        systemPrompt,
        agentPrompt,
        guardrails: mockGuardrails
      });

      console.log("Generated Messages:", messages);
      document.getElementById("output").textContent = JSON.stringify(messages, null, 2);
    } catch (err) {
      console.error(err);
      document.getElementById("output").textContent = "Error: " + err.message;
    }
  </script>
</head>
<body>
  <h1>Prompt Composer Test</h1>
  <pre id="output">Loading...</pre>
</body>
</html>
