<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Both Sections</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        button { margin: 5px; padding: 8px 16px; }
    </style>
</head>
<body>
    <h1>Verify Both Sections Working</h1>
    
    <div class="test-section">
        <h2>Quick Status Check</h2>
        <button onclick="checkStatus()">Check Status</button>
        <div id="status-results"></div>
    </div>
    
    <div class="test-section">
        <h2>Navigation Test</h2>
        <p>Test the actual navigation links:</p>
        <a href="llm-manager-admin-ui.html#configuration" target="_blank" style="margin-right: 10px;">→ Test Configuration Section</a>
        <a href="llm-manager-admin-ui.html#prompts" target="_blank">→ Test System Prompts Section</a>
    </div>

    <!-- Load dependencies -->
    <script src="debug-manager.js"></script>
    <script src="system-prompts-manager.js"></script>
    <script src="agents/llm-manager.js"></script>
    <script src="agents/guardrails-manager.js"></script>
    <script src="agents/voice-config-manager.js"></script>
    <script src="agents/agent-config-manager.js"></script>
    <script src="llm-manager-admin-ui.js"></script>
    
    <script>
        function addResult(containerId, message, type = 'info') {
            const container = document.getElementById(containerId);
            const div = document.createElement('div');
            div.className = `test-section ${type}`;
            div.innerHTML = message;
            container.appendChild(div);
        }
        
        function checkStatus() {
            const container = document.getElementById('status-results');
            container.innerHTML = '';
            
            // Check admin UI
            if (window.adminUI) {
                addResult('status-results', '✅ Admin UI is available', 'success');
                
                if (window.adminUI.llmManager) {
                    addResult('status-results', '✅ LLM Manager is available', 'success');
                    
                    try {
                        const configs = window.adminUI.llmManager.getAgentConfigurations();
                        addResult('status-results', `✅ Got ${Object.keys(configs).length} agent configurations`, 'success');
                    } catch (error) {
                        addResult('status-results', `⚠️ Error getting configurations: ${error.message}`, 'error');
                    }
                } else {
                    addResult('status-results', '⚠️ LLM Manager not available', 'error');
                }
            } else {
                addResult('status-results', '❌ Admin UI not available', 'error');
            }
            
            // Check key functions
            const keyFunctions = [
                'getAvailableAgents',
                'createAgentPromptCard',
                'loadAgentPromptsGrid'
            ];
            
            keyFunctions.forEach(funcName => {
                if (typeof window[funcName] === 'function') {
                    addResult('status-results', `✅ ${funcName} is available`, 'success');
                } else {
                    addResult('status-results', `❌ ${funcName} is missing`, 'error');
                }
            });
            
            // Test getting agents
            try {
                if (typeof getAvailableAgents === 'function') {
                    const agents = getAvailableAgents();
                    addResult('status-results', `✅ getAvailableAgents returned ${agents.length} agents`, 'success');
                }
            } catch (error) {
                addResult('status-results', `❌ Error calling getAvailableAgents: ${error.message}`, 'error');
            }
            
            // Check DOM elements
            const elements = [
                'agents-prompts-grid',
                'configurationContent',
                'prompts-section',
                'configuration-section'
            ];
            
            elements.forEach(elementId => {
                const element = document.getElementById(elementId);
                if (element) {
                    addResult('status-results', `✅ Element ${elementId} exists`, 'success');
                } else {
                    addResult('status-results', `⚠️ Element ${elementId} not found (normal for test page)`, 'info');
                }
            });
        }
        
        // Auto-run check when page loads
        window.addEventListener('load', () => {
            setTimeout(() => {
                checkStatus();
            }, 1000);
        });
    </script>
</body>
</html>
