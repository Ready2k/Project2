<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Fixes Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #f5f5f5; }
        .result { padding: 10px; margin: 5px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        .warning { background: #fff3cd; color: #856404; }
        h1 { color: #333; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>🔧 Final Fixes Verification Test</h1>
    
    <div class="test-section">
        <h2>📋 Dependency Loading Test</h2>
        <div id="dependencyResults"></div>
    </div>

    <div class="test-section">
        <h2>🚀 AgentRouter Initialization Test</h2>
        <div id="agentRouterResults"></div>
    </div>

    <div class="test-section">
        <h2>🎛️ Interface Controller Test</h2>
        <div id="interfaceResults"></div>
    </div>

    <div class="test-section">
        <h2>🔒 Security Manager Test</h2>
        <div id="securityResults"></div>
    </div>

    <!-- Load all scripts in correct order -->
    <script src="../debug-manager.js"></script>
    <script src="../persona-manager.js"></script>
    <script src="../system-prompts-manager.js"></script>
    <script src="../token-tracker.js"></script>
    <script src="../api-client.js"></script>
    <script src="../streaming-manager.js"></script>
    <script src="../agents/base-agent.js"></script>
    <script src="../agents/payments-agent.js"></script>
    <script src="../agents/fraud-agent.js"></script>
    <script src="../agents/idv-agent.js"></script>
    <script src="../agents/banking-info-agent.js"></script>
    <script src="../agents/guardrails-manager.js"></script>
    <script src="../agents/security-manager.js"></script>
    <script src="../agents/voice-config-manager.js"></script>
    <script src="../agents/llm-manager.js"></script>
    <script src="../agents/agent-config-manager.js"></script>
    <script src="../agents/agent-router.js"></script>
    <script src="../agent-telemetry.js"></script>
    <script src="../llm-manager-admin-ui.js"></script>
    <script src="../dependency-check.js"></script>
    <script src="../main-interface.js"></script>

    <script>
        function addResult(containerId, message, type = 'info') {
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.textContent = message;
            document.getElementById(containerId).appendChild(div);
        }

        // Test 1: Dependency Loading
        function testDependencies() {
            addResult('dependencyResults', '🔍 Testing dependency loading...', 'info');
            
            const criticalClasses = [
                'SecurityManager',
                'AgentConfigManager',
                'AgentRouter',
                'MainInterfaceController'
            ];

            let allAvailable = true;
            criticalClasses.forEach(className => {
                if (typeof window[className] !== 'undefined') {
                    addResult('dependencyResults', `✅ ${className} - Available`, 'success');
                } else {
                    addResult('dependencyResults', `❌ ${className} - Missing`, 'error');
                    allAvailable = false;
                }
            });

            if (allAvailable) {
                addResult('dependencyResults', '🎉 All critical dependencies loaded!', 'success');
            } else {
                addResult('dependencyResults', '⚠️ Some dependencies missing', 'warning');
            }
        }

        // Test 2: AgentRouter Initialization
        function testAgentRouter() {
            addResult('agentRouterResults', '🚀 Testing AgentRouter initialization...', 'info');
            
            try {
                if (typeof AgentRouter !== 'undefined' && typeof SecurityManager !== 'undefined') {
                    const router = new AgentRouter([]);
                    addResult('agentRouterResults', '✅ AgentRouter instantiated successfully', 'success');
                    
                    // Test security manager integration
                    const securityManager = router.getSecurityManager();
                    if (securityManager) {
                        addResult('agentRouterResults', '✅ SecurityManager integrated correctly', 'success');
                    } else {
                        addResult('agentRouterResults', '❌ SecurityManager not integrated', 'error');
                    }
                    
                    // Test agent registration
                    if (typeof PaymentsAgent !== 'undefined') {
                        const paymentsAgent = new PaymentsAgent();
                        router.registerAgent(paymentsAgent);
                        addResult('agentRouterResults', '✅ Agent registration works', 'success');
                    }
                    
                    const stats = router.getStats();
                    addResult('agentRouterResults', `📊 Router Stats: ${stats.totalAgents} total, ${stats.enabledAgents} enabled`, 'info');
                    
                } else {
                    addResult('agentRouterResults', '❌ Required classes not available', 'error');
                }
            } catch (error) {
                addResult('agentRouterResults', `❌ AgentRouter test failed: ${error.message}`, 'error');
            }
        }

        // Test 3: Interface Controller
        function testInterfaceController() {
            addResult('interfaceResults', '🎛️ Testing MainInterfaceController...', 'info');
            
            if (typeof MainInterfaceController !== 'undefined') {
                addResult('interfaceResults', '✅ MainInterfaceController class available', 'success');
                
                try {
                    // Check if instance exists
                    if (window.mainInterface) {
                        addResult('interfaceResults', '✅ MainInterface instance available', 'success');
                        
                        // Test key methods
                        if (typeof window.mainInterface.updateStatus === 'function') {
                            addResult('interfaceResults', '✅ Interface methods available', 'success');
                        }
                    } else {
                        addResult('interfaceResults', '⚠️ MainInterface instance not yet created', 'warning');
                    }
                } catch (error) {
                    addResult('interfaceResults', `❌ Interface test error: ${error.message}`, 'error');
                }
            } else {
                addResult('interfaceResults', '❌ MainInterfaceController not available', 'error');
            }
        }

        // Test 4: Security Manager
        function testSecurityManager() {
            addResult('securityResults', '🔒 Testing SecurityManager...', 'info');
            
            try {
                if (typeof SecurityManager !== 'undefined') {
                    const securityManager = new SecurityManager();
                    addResult('securityResults', '✅ SecurityManager can be instantiated', 'success');
                    
                    // Test domain permissions
                    const permissions = securityManager.getDomainPermissions('IDVAgent');
                    if (permissions && permissions.allowedDataTypes) {
                        addResult('securityResults', '✅ Domain permissions configured', 'success');
                    }
                    
                    // Test audit logging
                    securityManager.logSecurityEvent('test', 'Test event', { test: true });
                    const auditLog = securityManager.getAuditLog();
                    if (auditLog && auditLog.length > 0) {
                        addResult('securityResults', '✅ Audit logging works', 'success');
                    }
                    
                } else {
                    addResult('securityResults', '❌ SecurityManager not available', 'error');
                }
            } catch (error) {
                addResult('securityResults', `❌ SecurityManager test failed: ${error.message}`, 'error');
            }
        }

        // Run tests when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                testDependencies();
                testAgentRouter();
                testInterfaceController();
                testSecurityManager();
                
                // Final summary
                setTimeout(() => {
                    console.log('🎉 All tests completed! Check results above.');
                }, 1000);
            }, 500);
        });

        // Capture any errors
        window.addEventListener('error', (event) => {
            addResult('dependencyResults', `❌ JavaScript Error: ${event.message} (${event.filename}:${event.lineno})`, 'error');
        });
    </script>
</body>
</html>
