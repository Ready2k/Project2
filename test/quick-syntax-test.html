<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Syntax Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 20px;
            background: #f5f7fa;
        }
        .test-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .result {
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            font-family: monospace;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🧪 Quick Syntax Test</h1>
        <p>Testing if the syntax errors have been resolved...</p>
        <div id="results"></div>
    </div>

    <!-- Test loading the fixed files -->
    <script src="../debug-manager.js"></script>
    <script src="../persona-manager.js"></script>
    <script src="../system-prompts-manager.js"></script>
    <script src="../token-tracker.js"></script>

    <script>
        function addResult(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.textContent = message;
            document.getElementById('results').appendChild(div);
        }

        // Test if classes loaded successfully
        setTimeout(() => {
            addResult('Testing class availability...', 'info');
            
            if (typeof PersonaManager !== 'undefined') {
                addResult('✅ PersonaManager loaded successfully', 'success');
                
                try {
                    const pm = new PersonaManager();
                    addResult('✅ PersonaManager can be instantiated', 'success');
                } catch (error) {
                    addResult(`❌ PersonaManager instantiation failed: ${error.message}`, 'error');
                }
            } else {
                addResult('❌ PersonaManager not available', 'error');
            }

            if (typeof SystemPromptsManager !== 'undefined') {
                addResult('✅ SystemPromptsManager loaded successfully', 'success');
                
                try {
                    const spm = new SystemPromptsManager();
                    addResult('✅ SystemPromptsManager can be instantiated', 'success');
                } catch (error) {
                    addResult(`❌ SystemPromptsManager instantiation failed: ${error.message}`, 'error');
                }
            } else {
                addResult('❌ SystemPromptsManager not available', 'error');
            }

            if (typeof TokenTracker !== 'undefined') {
                addResult('✅ TokenTracker loaded successfully', 'success');
            } else {
                addResult('❌ TokenTracker not available', 'error');
            }

            if (window.debugManager) {
                addResult('✅ DebugManager loaded successfully', 'success');
            } else {
                addResult('❌ DebugManager not available', 'error');
            }

            addResult('🎉 Syntax test completed!', 'info');
        }, 100);

        // Capture any errors
        window.addEventListener('error', (event) => {
            addResult(`❌ JavaScript Error: ${event.message} (${event.filename}:${event.lineno})`, 'error');
        });
    </script>
</body>
</html>
