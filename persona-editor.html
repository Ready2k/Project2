<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persona Editor - AI Voice Assistant</title>
    <link rel="stylesheet" href="main-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Dedicated styles for persona editor */
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .editor-container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .editor-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .editor-header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .close-editor {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .close-editor:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }

        .editor-content {
            padding: 30px;
        }

        .persona-form {
            display: grid;
            gap: 25px;
        }

        .form-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 25px;
            border: 1px solid #e9ecef;
        }

        .form-section h3 {
            margin: 0 0 20px 0;
            color: #2c3e50;
            font-weight: 600;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-weight: 600;
            color: #495057;
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: white;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .transactions-section {
            margin-top: 10px;
        }

        .transactions-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .transactions-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .transaction-item {
            display: grid;
            grid-template-columns: 150px 120px 1fr auto;
            gap: 15px;
            align-items: start;
            padding: 15px;
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .transaction-item:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.1);
        }

        .transaction-field {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .transaction-field label {
            font-size: 12px;
            font-weight: 600;
            color: #495057;
            margin: 0;
        }

        .transaction-field input {
            margin: 0;
            padding: 8px 12px;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            font-size: 13px;
            width: 100%;
            box-sizing: border-box;
        }

        .transaction-field input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.1);
        }

        .transaction-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 20px;
        }

        /* Color coding for transaction amounts */
        .transaction-field input[name*="_amount"] {
            font-weight: 600;
        }

        .transaction-field input[name*="_amount"]:valid {
            color: #495057;
        }

        /* Visual feedback for positive/negative amounts */
        .transaction-field input[name*="_amount"][data-positive="true"] {
            color: #28a745;
            background-color: rgba(40, 167, 69, 0.05);
        }

        .transaction-field input[name*="_amount"][data-negative="true"] {
            color: #dc3545;
            background-color: rgba(220, 53, 69, 0.05);
        }

        .add-transaction-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .add-transaction-btn:hover {
            background: #218838;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
        }

        .remove-transaction-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .remove-transaction-btn:hover {
            background: #c82333;
            transform: scale(1.1);
        }

        .editor-actions {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin-top: 30px;
            padding-top: 25px;
            border-top: 2px solid #e9ecef;
        }

        .action-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-btn.primary {
            background: #667eea;
            color: white;
        }

        .action-btn.primary:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .action-btn.secondary {
            background: #6c757d;
            color: white;
        }

        .action-btn.secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        .loading-spinner {
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Scrollbar styling */
        .transactions-list::-webkit-scrollbar {
            width: 8px;
        }

        .transactions-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        .transactions-list::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 4px;
        }

        .transactions-list::-webkit-scrollbar-thumb:hover {
            background: #5a67d8;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .editor-header {
                padding: 20px;
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .editor-content {
                padding: 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .transaction-item {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .transaction-actions {
                padding-top: 10px;
            }

            .editor-actions {
                flex-direction: column;
            }

            .transactions-header {
                flex-direction: column;
                gap: 15px;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner">
            <div class="spinner"></div>
            <div>Loading persona data...</div>
        </div>
    </div>

    <div class="editor-container">
        <div class="editor-header">
            <h1>
                <i class="fas fa-user-edit"></i>
                Edit Persona
            </h1>
            <button class="close-editor" onclick="closeEditor()">
                <i class="fas fa-times"></i>
                Close Editor
            </button>
        </div>

        <div class="editor-content">
            <form id="personaEditorForm" class="persona-form">
                <input type="hidden" id="personaId">

                <!-- Basic Information -->
                <div class="form-section">
                    <h3>
                        <i class="fas fa-user"></i>
                        Basic Information
                    </h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="personaName">Full Name</label>
                            <input type="text" id="personaName" required placeholder="Enter full name">
                        </div>
                        <div class="form-group">
                            <label for="personaBalance">Account Balance (£)</label>
                            <input type="number" id="personaBalance" step="0.01" required placeholder="0.00">
                        </div>
                        <div class="form-group">
                            <label for="personaCard">Card Number (Last 4 digits)</label>
                            <input type="text" id="personaCard" maxlength="4" required placeholder="1234">
                        </div>
                        <div class="form-group">
                            <label for="personaAccountType">Account Type</label>
                            <select id="personaAccountType" required>
                                <option value="checking">Checking Account</option>
                                <option value="savings">Savings Account</option>
                                <option value="premium">Premium Account</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Transactions Management -->
                <div class="form-section">
                    <h3>
                        <i class="fas fa-exchange-alt"></i>
                        Transaction History
                    </h3>
                    <div class="transactions-section">
                        <div class="transactions-header">
                            <div>
                                <p style="margin: 0; color: #6c757d; font-size: 14px;">
                                    Manage transaction history for this persona. Recent transactions will be shown in conversations.
                                </p>
                            </div>
                            <button type="button" id="addTransactionBtn" class="add-transaction-btn">
                                <i class="fas fa-plus"></i>
                                Add Transaction
                            </button>
                        </div>
                        <div id="transactionsList" class="transactions-list">
                            <!-- Transactions will be loaded here -->
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="editor-actions">
                    <button type="button" class="action-btn secondary" onclick="closeEditor()">
                        <i class="fas fa-times"></i>
                        Cancel
                    </button>
                    <button type="submit" class="action-btn primary">
                        <i class="fas fa-save"></i>
                        Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="debug-manager.js"></script>
    <script src="system-logger.js"></script>
    <script src="persona-manager.js"></script>
    <script src="persona-editor.js"></script>
</body>
</html>
