<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test System Prompts Manager</title>
</head>
<body>
    <h1>System Prompts Manager Test</h1>
    <div id="output"></div>
    
    <script src="../system-prompts-manager.js"></script>
    <script>
        async function testSystemPromptsManager() {
            const output = document.getElementById('output');
            const systemPromptsManager = new SystemPromptsManager();
            
            try {
                await systemPromptsManager.init();
                
                const allPrompts = systemPromptsManager.getAllPrompts();
                
                // Test persona data
                const testPersona = {
                    name: 'John Doe',
                    accountType: 'checking',
                    balance: 1500.75,
                    cardLast4: '1234',
                    recentTransactions: [
                        { date: '2025-01-15', amount: -45.67, description: 'Coffee Shop' },
                        { date: '2025-01-14', amount: -120.00, description: 'Tesco Groceries' }
                    ]
                };
                
                // Set currency formatter
                systemPromptsManager.setCurrencyFormatter((amount) => {
                    return new Intl.NumberFormat('en-GB', {
                        style: 'currency',
                        currency: 'GBP'
                    }).format(amount);
                });
                
                const generatedPrompt = systemPromptsManager.generateSystemPrompt(testPersona, 'test message');
                
                output.innerHTML = `
                    <h2>Loaded System Prompts:</h2>
                    <h3>Base Personality:</h3>
                    <p>${allPrompts.basePersonality}</p>
                    
                    <h3>Financial Context:</h3>
                    <pre>${allPrompts.financialContext}</pre>
                    
                    <h3>Response Instructions:</h3>
                    <pre>${allPrompts.responseInstructions}</pre>
                    
                    <h3>Custom Prompts:</h3>
                    <pre>${JSON.stringify(allPrompts.customPrompts, null, 2)}</pre>
                    
                    <h2>Generated System Prompt:</h2>
                    <pre style="background: #f5f5f5; padding: 15px; border-radius: 5px; white-space: pre-wrap;">${generatedPrompt}</pre>
                `;
            } catch (error) {
                output.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }
        
        testSystemPromptsManager();
    </script>
</body>
</html>
