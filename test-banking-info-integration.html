<!DOCTYPE html>
<html>
<head>
    <title>BankingInfoAgent Integration Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .pass { color: green; }
        .fail { color: red; }
        .test-input { background: #f5f5f5; padding: 10px; margin: 5px 0; border-radius: 3px; }
        .test-output { background: #e8f4fd; padding: 10px; margin: 5px 0; border-radius: 3px; }
        .interactive-section { background: #f9f9f9; padding: 20px; margin: 20px 0; border-radius: 5px; }
        input[type="text"] { width: 300px; padding: 8px; margin: 5px; }
        button { padding: 8px 15px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>BankingInfoAgent Integration Test</h1>
    <div id="test-results"></div>
    
    <div class="interactive-section">
        <h3>Interactive Testing</h3>
        <p>Test the BankingInfoAgent with custom inputs:</p>
        <input type="text" id="testInput" placeholder="Enter your banking question..." value="What is my account balance?">
        <button onclick="testCustomInput()">Test Input</button>
        <div id="interactive-results"></div>
    </div>

    <script src="debug-manager.js"></script>
    <script src="persona-manager.js"></script>
    <script src="agents/base-agent.js"></script>
    <script src="agents/agent-router.js"></script>
    <script src="agents/idv-agent.js"></script>
    <script src="agents/banking-info-agent.js"></script>
    <script>
        // Enable debug mode for testing
        window.debugManager.enable();
        
        console.log('Testing BankingInfoAgent integration with AgentRouter...');
        
        // Initialize PersonaManager with test data
        const personaManager = new PersonaManager();
        personaManager.personas = {
            'john_doe': {
                name: 'John Doe',
                balance: 2450.75,
                cardLast4: '1234',
                accountType: 'checking',
                currency: 'GBP',
                recentTransactions: [
                    { date: '2025-01-15', amount: -45.67, description: 'Coffee Shop' },
                    { date: '2025-01-14', amount: -120.00, description: 'Tesco Groceries' },
                    { date: '2025-01-13', amount: 1500.00, description: 'Salary Deposit' }
                ]
            }
        };
        personaManager.initialized = true;
        
        // Mock dependencies
        const mockSystemPromptsManager = {
            getSystemPrompt: () => 'You are a helpful banking assistant.'
        };
        
        const mockApiClient = {
            createChatCompletion: async (params) => {
                // Simulate different responses based on input
                let responseContent = 'Mock banking response';
                
                if (params.messages[1].content.toLowerCase().includes('balance')) {
                    responseContent = 'Your current account balance is £2,450.75. Your account is in good standing.';
                } else if (params.messages[1].content.toLowerCase().includes('transaction')) {
                    responseContent = 'Here are your recent transactions: Coffee Shop (-£45.67), Tesco Groceries (-£120.00), Salary Deposit (+£1,500.00).';
                } else if (params.messages[1].content.toLowerCase().includes('account')) {
                    responseContent = 'Your account details: John Doe, Checking Account, Card ending in 1234, Balance: £2,450.75.';
                }
                
                return {
                    choices: [{ message: { content: responseContent } }],
                    usage: { total_tokens: 150 }
                };
            },
            generateResponse: async (inputText, options) => ({
                content: 'Fallback response for general inquiry',
                tokensUsed: 100
            })
        };
        
        const mockTokenTracker = {
            addTokens: (tokens, agent) => console.log(`Tracked ${tokens} tokens for ${agent}`),
            trackGptUsage: (inputTokens, outputTokens) => console.log(`Token tracking: ${inputTokens} input, ${outputTokens} output tokens`),
            trackWhisperUsage: (minutes) => console.log(`Token tracking: ${minutes} minutes of Whisper usage`),
            trackTtsUsage: (characters, model) => console.log(`Token tracking: ${characters} characters for TTS (${model})`),
            getUsage: () => ({ whisper: { requests: 0, cost: 0 }, gpt: { tokens: 0, cost: 0 }, tts: { characters: 0, cost: 0 }, total: 0 })
        };
        
        const mockContext = {
            personaManager: personaManager,
            systemPromptsManager: mockSystemPromptsManager,
            apiClient: mockApiClient,
            tokenTracker: mockTokenTracker
        };
        
        // Create agents and router
        const idvAgent = new IDVAgent();
        const bankingInfoAgent = new BankingInfoAgent();
        const agentRouter = new AgentRouter([idvAgent, bankingInfoAgent]);
        
        // Test results storage
        const testResults = [];
        
        // Test 1: Agent registration
        function testAgentRegistration() {
            const stats = agentRouter.getStats();
            const hasBankingAgent = stats.agentNames.includes('BankingInfoAgent');
            const hasIDVAgent = stats.agentNames.includes('IDVAgent');
            
            testResults.push({
                name: 'Agent Registration',
                passed: hasBankingAgent && hasIDVAgent && stats.totalAgents === 2,
                details: `Registered agents: ${stats.agentNames.join(', ')} (Total: ${stats.totalAgents})`
            });
        }
        
        // Test 2: Routing to BankingInfoAgent
        async function testRoutingToBankingAgent() {
            const testInputs = [
                'What is my account balance?',
                'Show me my recent transactions',
                'Account statement please'
            ];
            
            const results = [];
            let allPassed = true;
            
            for (const input of testInputs) {
                try {
                    const response = await agentRouter.route(input, mockContext);
                    const correctAgent = response.agentName === 'BankingInfoAgent';
                    const successful = response.success;
                    
                    results.push(`"${input}": ${correctAgent && successful ? '✅' : '❌'} (Agent: ${response.agentName})`);
                    
                    if (!correctAgent || !successful) {
                        allPassed = false;
                    }
                } catch (error) {
                    results.push(`"${input}": ❌ Error: ${error.message}`);
                    allPassed = false;
                }
            }
            
            testResults.push({
                name: 'Routing to BankingInfoAgent',
                passed: allPassed,
                details: results.join('<br>')
            });
        }
        
        // Test 3: Routing to IDVAgent (should not go to BankingInfoAgent)
        async function testRoutingToIDVAgent() {
            const testInputs = [
                'Verify my identity',
                'I forgot my password',
                'Reset my PIN'
            ];
            
            const results = [];
            let allPassed = true;
            
            for (const input of testInputs) {
                try {
                    const response = await agentRouter.route(input, mockContext);
                    const correctAgent = response.agentName === 'IDVAgent';
                    const notBankingAgent = response.agentName !== 'BankingInfoAgent';
                    
                    results.push(`"${input}": ${correctAgent && notBankingAgent ? '✅' : '❌'} (Agent: ${response.agentName})`);
                    
                    if (!correctAgent || !notBankingAgent) {
                        allPassed = false;
                    }
                } catch (error) {
                    results.push(`"${input}": ❌ Error: ${error.message}`);
                    allPassed = false;
                }
            }
            
            testResults.push({
                name: 'Routing to IDVAgent (not Banking)',
                passed: allPassed,
                details: results.join('<br>')
            });
        }
        
        // Test 4: Fallback handling
        async function testFallbackHandling() {
            const testInputs = [
                'What\'s the weather like?',
                'Hello there',
                'Tell me a joke'
            ];
            
            const results = [];
            let allPassed = true;
            
            for (const input of testInputs) {
                try {
                    const response = await agentRouter.route(input, mockContext);
                    const isFallback = response.agentName === 'FallbackHandler';
                    const notBankingAgent = response.agentName !== 'BankingInfoAgent';
                    
                    results.push(`"${input}": ${isFallback && notBankingAgent ? '✅' : '❌'} (Agent: ${response.agentName})`);
                    
                    if (!isFallback || !notBankingAgent) {
                        allPassed = false;
                    }
                } catch (error) {
                    results.push(`"${input}": ❌ Error: ${error.message}`);
                    allPassed = false;
                }
            }
            
            testResults.push({
                name: 'Fallback Handling',
                passed: allPassed,
                details: results.join('<br>')
            });
        }
        
        // Test 5: Response format validation
        async function testResponseFormat() {
            const input = 'Check my balance';
            
            try {
                const response = await agentRouter.route(input, mockContext);
                
                const hasRequiredFields = response.hasOwnProperty('success') &&
                                        response.hasOwnProperty('response') &&
                                        response.hasOwnProperty('agentName') &&
                                        response.hasOwnProperty('processingTime') &&
                                        response.hasOwnProperty('tokensUsed') &&
                                        response.hasOwnProperty('metadata');
                
                const hasCorrectMetadata = response.metadata &&
                                         response.metadata.agentType === 'banking_information' &&
                                         response.metadata.dataAccess === 'read_only';
                
                const passed = hasRequiredFields && hasCorrectMetadata;
                
                testResults.push({
                    name: 'Response Format Validation',
                    passed,
                    details: `Required fields: ${hasRequiredFields ? '✅' : '❌'}, Metadata: ${hasCorrectMetadata ? '✅' : '❌'}`
                });
            } catch (error) {
                testResults.push({
                    name: 'Response Format Validation',
                    passed: false,
                    details: `Error: ${error.message}`
                });
            }
        }
        
        // Interactive testing function
        async function testCustomInput() {
            const input = document.getElementById('testInput').value;
            const resultsDiv = document.getElementById('interactive-results');
            
            if (!input.trim()) {
                resultsDiv.innerHTML = '<div class="fail">Please enter a test input</div>';
                return;
            }
            
            try {
                resultsDiv.innerHTML = '<div>Processing...</div>';
                
                const response = await agentRouter.route(input, mockContext);
                
                resultsDiv.innerHTML = `
                    <div class="test-input"><strong>Input:</strong> ${input}</div>
                    <div class="test-output">
                        <strong>Agent:</strong> ${response.agentName}<br>
                        <strong>Success:</strong> ${response.success}<br>
                        <strong>Response:</strong> ${response.response}<br>
                        <strong>Processing Time:</strong> ${response.processingTime}ms<br>
                        <strong>Tokens Used:</strong> ${response.tokensUsed}<br>
                        <strong>Category:</strong> ${response.metadata?.inputCategory || 'N/A'}
                    </div>
                `;
            } catch (error) {
                resultsDiv.innerHTML = `<div class="fail">Error: ${error.message}</div>`;
            }
        }
        
        // Make testCustomInput available globally
        window.testCustomInput = testCustomInput;
        
        // Run all tests
        async function runAllTests() {
            console.log('Running BankingInfoAgent integration tests...');
            
            testAgentRegistration();
            await testRoutingToBankingAgent();
            await testRoutingToIDVAgent();
            await testFallbackHandling();
            await testResponseFormat();
            
            displayResults();
        }
        
        function displayResults() {
            const resultsDiv = document.getElementById('test-results');
            const passedTests = testResults.filter(t => t.passed).length;
            const totalTests = testResults.length;
            
            let html = `<h2>Integration Test Results: ${passedTests}/${totalTests} Passed</h2>`;
            
            testResults.forEach(test => {
                const statusClass = test.passed ? 'pass' : 'fail';
                const statusIcon = test.passed ? '✅' : '❌';
                
                html += `
                    <div class="test-section">
                        <h3 class="${statusClass}">${statusIcon} ${test.name}</h3>
                        <div>${test.details}</div>
                    </div>
                `;
            });
            
            if (passedTests === totalTests) {
                html += `
                    <div class="test-section" style="background-color: #d4edda; border-color: #c3e6cb;">
                        <h3 class="pass">🎉 All Integration Tests Passed!</h3>
                        <p>BankingInfoAgent is properly integrated with the AgentRouter and ready for production use.</p>
                    </div>
                `;
            } else {
                html += `
                    <div class="test-section" style="background-color: #f8d7da; border-color: #f5c6cb;">
                        <h3 class="fail">⚠️ Some Integration Tests Failed</h3>
                        <p>Please review the failed tests and fix the issues before proceeding.</p>
                    </div>
                `;
            }
            
            resultsDiv.innerHTML = html;
        }
        
        // Start testing
        runAllTests();
    </script>
</body>
</html>
