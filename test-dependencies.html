<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dependency Test - Professional Voice Assistant</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 20px;
            background: #f5f7fa;
        }
        .test-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .test-result {
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            font-family: monospace;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
        }
        h2 {
            color: #495057;
            border-bottom: 2px solid #e9ecef;
            padding-bottom: 10px;
        }
        .summary {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #667eea;
        }
        .test-button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 5px;
            font-size: 14px;
        }
        .test-button:hover {
            background: #5a67d8;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🧪 Dependency & Integration Test</h1>
        
        <div class="summary">
            <h3>Test Status</h3>
            <div id="testStatus">Loading tests...</div>
        </div>

        <h2>Dependency Check Results</h2>
        <div id="dependencyResults">
            <div class="info">Running dependency checks...</div>
        </div>

        <h2>Integration Tests</h2>
        <div>
            <button class="test-button" onclick="testManagerInitialization()">Test Manager Initialization</button>
            <button class="test-button" onclick="testInterfaceIntegration()">Test Interface Integration</button>
            <button class="test-button" onclick="testScriptLoading()">Test Script Loading Order</button>
            <button class="test-button" onclick="runAllTests()">Run All Tests</button>
        </div>
        <div id="integrationResults">
            <div class="info">Click a test button to run integration tests...</div>
        </div>

        <h2>Console Output</h2>
        <div id="consoleOutput" style="background: #2c3e50; color: #ecf0f1; padding: 15px; border-radius: 5px; font-family: monospace; max-height: 300px; overflow-y: auto;">
            Console output will appear here...
        </div>
    </div>

    <!-- Load all scripts in the correct order -->
    <script src="debug-manager.js"></script>
    <script src="persona-manager.js"></script>
    <script src="system-prompts-manager.js"></script>
    <script src="token-tracker.js"></script>
    <script src="api-client.js"></script>
    <script src="streaming-manager.js"></script>
    <!-- Agent system scripts -->
    <script src="agents/base-agent.js"></script>
    <script src="agents/payments-agent.js"></script>
    <script src="agents/fraud-agent.js"></script>
    <script src="agents/idv-agent.js"></script>
    <script src="agents/banking-info-agent.js"></script>
    <script src="agents/guardrails-manager.js"></script>
    <script src="agents/voice-config-manager.js"></script>
    <script src="agents/llm-manager.js"></script>
    <script src="agents/agent-router.js"></script>
    <script src="agent-telemetry.js"></script>
    <script src="llm-manager-admin-ui.js"></script>
    <!-- Dependency check -->
    <script src="dependency-check.js"></script>

    <script>
        // Capture console output
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;
        
        let consoleOutput = [];
        
        function captureConsole(type, ...args) {
            const message = args.map(arg => 
                typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)
            ).join(' ');
            
            consoleOutput.push(`[${type.toUpperCase()}] ${message}`);
            updateConsoleDisplay();
            
            // Call original function
            if (type === 'log') originalLog(...args);
            else if (type === 'error') originalError(...args);
            else if (type === 'warn') originalWarn(...args);
        }
        
        console.log = (...args) => captureConsole('log', ...args);
        console.error = (...args) => captureConsole('error', ...args);
        console.warn = (...args) => captureConsole('warn', ...args);
        
        function updateConsoleDisplay() {
            const consoleDiv = document.getElementById('consoleOutput');
            consoleDiv.innerHTML = consoleOutput.slice(-20).join('\n');
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }
        
        function addResult(containerId, message, type = 'info') {
            const container = document.getElementById(containerId);
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.textContent = message;
            container.appendChild(div);
        }
        
        function clearResults(containerId) {
            document.getElementById(containerId).innerHTML = '';
        }
        
        function testManagerInitialization() {
            clearResults('integrationResults');
            addResult('integrationResults', 'Testing manager initialization...', 'info');
            
            try {
                // Test LLMManager
                if (typeof LLMManager !== 'undefined') {
                    const llmManager = new LLMManager();
                    addResult('integrationResults', '✅ LLMManager can be instantiated', 'success');
                } else {
                    addResult('integrationResults', '❌ LLMManager not available', 'error');
                }
                
                // Test VoiceConfigManager
                if (typeof VoiceConfigManager !== 'undefined') {
                    const voiceManager = new VoiceConfigManager();
                    addResult('integrationResults', '✅ VoiceConfigManager can be instantiated', 'success');
                } else {
                    addResult('integrationResults', '❌ VoiceConfigManager not available', 'error');
                }
                
                // Test GuardrailsManager
                if (typeof GuardrailsManager !== 'undefined') {
                    const guardrailsManager = new GuardrailsManager();
                    addResult('integrationResults', '✅ GuardrailsManager can be instantiated', 'success');
                } else {
                    addResult('integrationResults', '❌ GuardrailsManager not available', 'error');
                }
                
            } catch (error) {
                addResult('integrationResults', `❌ Manager initialization failed: ${error.message}`, 'error');
            }
        }
        
        function testInterfaceIntegration() {
            clearResults('integrationResults');
            addResult('integrationResults', 'Testing interface integration...', 'info');
            
            // Test if MainInterfaceController is available
            if (typeof MainInterfaceController !== 'undefined') {
                addResult('integrationResults', '✅ MainInterfaceController class available', 'success');
            } else {
                addResult('integrationResults', '❌ MainInterfaceController not available', 'error');
            }
            
            // Test if window.mainInterface exists
            if (window.mainInterface) {
                addResult('integrationResults', '✅ window.mainInterface instance available', 'success');
            } else {
                addResult('integrationResults', '❌ window.mainInterface not initialized', 'error');
            }
        }
        
        function testScriptLoading() {
            clearResults('integrationResults');
            addResult('integrationResults', 'Testing script loading order...', 'info');
            
            const requiredGlobals = [
                'debugManager',
                'PersonaManager', 
                'SystemPromptsManager',
                'TokenTracker',
                'OpenAIClient',
                'StreamingManager',
                'BaseAgent',
                'GuardrailsManager',
                'VoiceConfigManager',
                'LLMManager',
                'AgentRouter',
                'LLMManagerAdminUI'
            ];
            
            let loadedCount = 0;
            requiredGlobals.forEach(globalName => {
                if (window[globalName]) {
                    addResult('integrationResults', `✅ ${globalName} loaded`, 'success');
                    loadedCount++;
                } else {
                    addResult('integrationResults', `❌ ${globalName} not loaded`, 'error');
                }
            });
            
            addResult('integrationResults', `📊 Loaded: ${loadedCount}/${requiredGlobals.length}`, 'info');
        }
        
        function runAllTests() {
            clearResults('integrationResults');
            addResult('integrationResults', '🚀 Running all tests...', 'info');
            
            setTimeout(() => testScriptLoading(), 100);
            setTimeout(() => testManagerInitialization(), 500);
            setTimeout(() => testInterfaceIntegration(), 1000);
            setTimeout(() => {
                addResult('integrationResults', '✅ All tests completed!', 'success');
            }, 1500);
        }
        
        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', () => {
            // Update dependency results
            setTimeout(() => {
                const dependencyDiv = document.getElementById('dependencyResults');
                dependencyDiv.innerHTML = '';
                
                if (window.dependencyCheck) {
                    const { available, missing, allAvailable } = window.dependencyCheck;
                    
                    if (allAvailable) {
                        addResult('dependencyResults', '🎉 All dependencies are available!', 'success');
                    } else {
                        addResult('dependencyResults', `⚠️ ${missing.length} dependencies missing`, 'warning');
                        missing.forEach(dep => {
                            addResult('dependencyResults', `❌ Missing: ${dep}`, 'error');
                        });
                    }
                    
                    addResult('dependencyResults', `✅ Available: ${available.length}`, 'success');
                    addResult('dependencyResults', `❌ Missing: ${missing.length}`, missing.length > 0 ? 'error' : 'success');
                } else {
                    addResult('dependencyResults', '❌ Dependency check not available', 'error');
                }
                
                // Update test status
                const statusDiv = document.getElementById('testStatus');
                if (window.dependencyCheck && window.dependencyCheck.allAvailable) {
                    statusDiv.innerHTML = '<div class="success">✅ Ready for testing - All dependencies loaded</div>';
                } else {
                    statusDiv.innerHTML = '<div class="error">❌ Some dependencies missing - Tests may fail</div>';
                }
            }, 500);
        });
    </script>
</body>
</html>
